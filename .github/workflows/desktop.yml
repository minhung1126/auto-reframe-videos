name: Desktop installers

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
          - target: windows-x64
            runner: windows-latest
            architecture: x64
    env:
      TARGET: ${{ matrix.target }}
      VENDOR_MANIFEST: ${{ vars.DESKTOP_VENDOR_MANIFEST }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install pinned build tools
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Install macOS native toolchain
        if: runner.os == 'macOS'
        run: brew install ninja nasm pkg-config
      - name: Install Windows native toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm
      - name: Add Windows toolchain to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
          "C:\msys64\usr\bin" >> $env:GITHUB_PATH
      - name: Verify sources
        run: |
          python -m compileall -q auto_reframe_core tests scripts
          python -m unittest discover -s tests
      - name: Prepare pinned FFmpeg tools
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          if os.environ.get('VENDOR_MANIFEST'):
              config = json.loads(os.environ['VENDOR_MANIFEST'])[os.environ['TARGET']]
              cmd = [sys.executable, 'scripts/prepare_desktop_vendor.py', '--url', config['url'],
                     '--sha256', config['sha256'], '--destination', str(Path('build/vendor').resolve())]
          else:
              cmd = [sys.executable, '-m', 'scripts.build_ffmpeg_vendor', '--target', os.environ['TARGET'],
                     '--destination', 'build/vendor']
          subprocess.run(cmd, check=True)
          PY
      - name: Build, audit, transcode and package unsigned installers
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          cmd = [sys.executable, 'scripts/build_desktop.py', '--target', os.environ['TARGET'], '--vendor-dir', 'build/vendor']
          if os.environ['TARGET'] == 'windows-x64':
              cmd += ['--iscc', str(Path(os.environ['ProgramFiles(x86)']) / 'Inno Setup 6' / 'ISCC.exe')]
          subprocess.run(cmd, check=True)
          PY
      - name: Upload installers and verification records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop/*
          if-no-files-found: error
