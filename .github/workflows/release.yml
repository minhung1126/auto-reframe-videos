name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix (for example 2.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile Python sources
        run: python -m compileall -q auto_reframe.py auto_compress.py auto_reframe_gui.py video_utils.py auto_reframe_core tests scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests

  release:
    name: Publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Releases must be dispatched from $DEFAULT_BRANCH." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [[ ! -f LICENSE ]]; then
            echo "The root copyright notice LICENSE is required before publishing a Release." >&2
            exit 1
          fi
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION already exists." >&2
            exit 1
          fi

      - name: Build verified update archive
        run: |
          python scripts/build_release.py --version "$RELEASE_VERSION"
          python -m scripts.verify_release --version "$RELEASE_VERSION"

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            "dist/auto-reframe-videos-v$RELEASE_VERSION.zip" \
            "dist/SHA256SUMS-v$RELEASE_VERSION.txt" \
            --target "$GITHUB_SHA" \
            --title "Auto Reframe Videos v$RELEASE_VERSION" \
            --generate-notes
