name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(
            python -c 'from auto_reframe_core.version import __version__; print(__version__)'
          )"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "auto_reframe_core.version must use MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          expected_tag="v$RELEASE_VERSION"
          if [[ "$GITHUB_REF" != "refs/tags/$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application version $RELEASE_VERSION." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor \
            "$tag_commit" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "Release tag must point to a commit on $DEFAULT_BRANCH." >&2
            exit 1
          fi
          if [[ ! -f LICENSE ]]; then
            echo "The root copyright notice LICENSE is required before publishing a Release." >&2
            exit 1
          fi
          if gh release view "$expected_tag" >/dev/null 2>&1; then
            echo "Release $expected_tag already exists." >&2
            exit 1
          fi

  test:
    name: Verify ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk

      - name: Compile Python sources
        run: python -m compileall -q auto_reframe_core tests scripts

      - name: Check unified entry point
        run: python -m auto_reframe_core --help

      - name: Run unit tests
        run: python -m unittest discover -s tests

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build verified update archive
        run: |
          python scripts/build_release.py
          python -m scripts.verify_release

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            "dist/auto-reframe-videos-v$RELEASE_VERSION.zip" \
            "dist/SHA256SUMS-v$RELEASE_VERSION.txt" \
            --verify-tag \
            --title "Auto Reframe Videos v$RELEASE_VERSION" \
            --generate-notes
