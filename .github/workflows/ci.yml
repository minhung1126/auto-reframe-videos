name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk

      - name: Compile Python sources
        run: python -m compileall -q auto_reframe_core tests scripts

      - name: Check unified entry point
        run: python -m auto_reframe_core --help

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check release package
        run: |
          python scripts/build_release.py
          python -m scripts.verify_release
