name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb xauth

      - name: Compile Python sources
        run: python -m compileall -q auto_reframe_core tests scripts

      - name: Check unified entry point
        run: python -m auto_reframe_core --help

      - name: Run unit tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python -m unittest discover -s tests
          else
            python -m unittest discover -s tests
          fi

      - name: Check release package
        run: |
          python scripts/build_release.py
          python -m scripts.verify_release

  frozen-smoke:
    name: Verify frozen resources on Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install packaging and synthetic-media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk ffmpeg xvfb xauth
          python -m pip install -r packaging/requirements-build.txt
      - name: Build and run the production spec with empty PATH
        run: xvfb-run -a python -m scripts.verify_frozen_local
      - name: Save frozen verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frozen-linux-verification
          path: build/frozen-verification/smoke.json
          if-no-files-found: error

  desktop:
    needs: [test, frozen-smoke]
    uses: ./.github/workflows/desktop.yml
